<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tallbacken, Nacka</title>
<style>
  :root {
    --bg1: #1e3c72;
    --bg2: #2a5298;
    --card: rgba(255,255,255,0.08);
    --card-border: rgba(255,255,255,0.15);
    --text: #f5f7fa;
    --muted: #b8c4d9;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2) 60%, #12203f);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px 0;
  }
  .clock-card {
    text-align: center;
    padding: 28px 20px;
  }
  .clock {
    font-size: 3.4rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }
  .date {
    margin-top: 6px;
    color: var(--muted);
    font-size: 1rem;
    text-transform: capitalize;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 20px 22px;
    backdrop-filter: blur(6px);
  }
  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    color: var(--muted);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .weather-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .temp {
    font-size: 2.6rem;
    font-weight: 700;
  }
  .weather-desc {
    text-align: right;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.4;
  }
  .bus-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bus-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .bus-line {
    background: var(--accent);
    color: #1e2a44;
    font-weight: 700;
    font-size: 0.95rem;
    border-radius: 8px;
    padding: 4px 10px;
    min-width: 38px;
    text-align: center;
  }
  .bus-dest {
    flex: 1;
    font-size: 0.95rem;
  }
  .bus-time {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .bus-time.now { color: #7CFC93; }
  .bus-time.past { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
  .bus-item.departed { opacity: 0.55; }
  .status-msg {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 6px 0;
  }
  .footer-note {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    opacity: 0.7;
    margin-top: -6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tallbacken · Nacka</h1>

  <div class="card clock-card">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="dateLine">—</div>
  </div>

  <div class="card">
    <div class="card-title">🌤️ Temperatur i Nacka</div>
    <div class="weather-row">
      <div class="temp" id="temp">–°</div>
      <div class="weather-desc" id="weatherDesc">Hämtar väder…</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🚌 Nästa bussar från Tallbacken</div>
    <ul class="bus-list" id="busList">
      <li class="status-msg">Hämtar avgångar…</li>
    </ul>
  </div>

  <div class="footer-note">Väder: Open-Meteo · Bussar: SL Transport API (trafiklab.se)</div>
</div>

<script>
// ---------- Klocka ----------
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const date = now.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('clock').textContent = time;
  document.getElementById('dateLine').textContent = date;
}
updateClock();
setInterval(updateClock, 1000);

// ---------- Väder (Open-Meteo, ingen nyckel behövs) ----------
// Koordinater för Nacka
const NACKA_LAT = 59.31;
const NACKA_LON = 18.16;

const weatherCodeText = {
  0: "Klart", 1: "Mest klart", 2: "Växlande molnighet", 3: "Mulet",
  45: "Dimma", 48: "Rimfrostdimma",
  51: "Lätt duggregn", 53: "Duggregn", 55: "Kraftigt duggregn",
  61: "Lätt regn", 63: "Regn", 65: "Kraftigt regn",
  71: "Lätt snöfall", 73: "Snöfall", 75: "Kraftigt snöfall",
  80: "Regnskurar", 81: "Regnskurar", 82: "Kraftiga regnskurar",
  95: "Åska", 96: "Åska med hagel", 99: "Åska med kraftigt hagel"
};

async function loadWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${NACKA_LAT}&longitude=${NACKA_LON}&current=temperature_2m,weather_code,wind_speed_10m&timezone=Europe%2FStockholm`;
    const res = await fetch(url);
    const data = await res.json();
    const t = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    const wind = Math.round(data.current.wind_speed_10m);
    document.getElementById('temp').textContent = `${t}°`;
    document.getElementById('weatherDesc').textContent =
      `${weatherCodeText[code] || "Okänt väder"}\nVind ${wind} m/s`;
  } catch (e) {
    document.getElementById('weatherDesc').textContent = 'Kunde inte hämta väder';
  }
}
loadWeather();
setInterval(loadWeather, 10 * 60 * 1000); // uppdatera var 10:e minut

// ---------- Robust fetch: försök direkt, falla tillbaka på CORS-proxy ----------
// Om sidan öppnas som en lokal fil (file://) skickar webbläsaren "Origin: null",
// vilket vissa API:er (som SL:s) nekar. Då används en CORS-proxy som fallback.
async function fetchJSON(url) {
  try {
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (directErr) {
    try {
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status} (via proxy)`);
      return await res.json();
    } catch (proxyErr) {
      throw new Error(`${directErr.message} / proxy: ${proxyErr.message}`);
    }
  }
}

// ---------- Bussar (SL Transport API) ----------
let tallbackenSiteId = null;

async function findTallbackenSiteId() {
  const sites = await fetchJSON('https://transport.integration.sl.se/v1/sites?expand=true');
  // Leta upp en site som heter "Tallbacken (Nacka)" och helst har en anteckning om Nacka,
  // annars första träffen.
  const matches = sites.filter(s => s.abbreviation  === 'TABA');
  if (matches.length === 0) {
    throw new Error('Hittade ingen hållplats som heter Tallbacken (Nacka)');
  }
  const nackaMatch = matches.find(s => (s.note || '').toLowerCase().includes('nacka'));
  return (nackaMatch || matches[0]).id;
}

function formatDeparture(dep) {
  const now = new Date();
  const expected = new Date(dep.expected);
  const diffMin = Math.round((expected - now) / 60000);
  if (diffMin <= 0) {
    if (diffMin >= -1) return { text: 'Nu', now: true, past: false };
    return { text: `Avgick ${Math.abs(diffMin)} min sedan`, now: false, past: true };
  }
  if (diffMin === 1) return { text: '1 min', now: false, past: false };
  return { text: `${diffMin} min`, now: false, past: false };
}

async function loadBuses() {
  const list = document.getElementById('busList');
  try {
    if (!tallbackenSiteId) {
      tallbackenSiteId = await findTallbackenSiteId();
    }
    const data = await fetchJSON(`https://transport.integration.sl.se/v1/sites/${tallbackenSiteId}/departures`);

    const now = new Date();
    const windowStartMs = now.getTime() - 10 * 60 * 1000;  // 10 min tillbaka
    const windowEndMs = now.getTime() + 60 * 60 * 1000;    // 60 min framåt

    const buses = (data.departures || [])
      .filter(d => d.line && d.line.transport_mode === 'BUS')
      .filter(d => {
        const t = new Date(d.expected).getTime();
        return t >= windowStartMs && t <= windowEndMs;
      })
      .sort((a, b) => new Date(a.expected) - new Date(b.expected));

    if (buses.length === 0) {
      list.innerHTML = '<li class="status-msg">Inga bussavgångar inom den senaste 10 min eller kommande timmen.</li>';
      return;
    }

    list.innerHTML = buses.map(dep => {
      const { text, now: isNow, past } = formatDeparture(dep);
      const timeClass = isNow ? 'now' : (past ? 'past' : '');
      return `
        <li class="bus-item ${past ? 'departed' : ''}">
          <span class="bus-line">${dep.line.designation || dep.line.id}</span>
          <span class="bus-dest">${dep.destination || dep.direction || ''}</span>
          <span class="bus-time ${timeClass}">${text}</span>
        </li>`;
    }).join('');
  } catch (e) {
    list.innerHTML = `<li class="status-msg">Kunde inte hämta bussavgångar (${e.message}).</li>`;
  }
}
loadBuses();
setInterval(loadBuses, 30 * 1000); // uppdatera var 30:e sekund
</script>
</body>
</html>
